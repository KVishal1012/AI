runtime: python312
instance_class: F4
automatic_scaling:
  min_instances: 1
  max_instances: 10
  target_cpu_utilization: 0.7

env_variables:
  SERVICE_ACCOUNT_KEY: "YOUR_BASE64_KEY"
  PROJECT_ID: "YOUR_PROJECT_ID"

handlers:
- url: /.*
  script: auto

# Optional: Add VPC access for enhanced security
# vpc_access_connector:
#   name: projects/YOUR_PROJECT/locations/us-central1/connectors/urban-planning-connector

# Optional: Add Cloud SQL for database
# beta_settings:
#   cloud_sql_instances: YOUR_PROJECT:us-central1:urban-planning-db
