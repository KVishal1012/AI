apiVersion: apps/v1
kind: Deployment
metadata:
  name: urban-planning-agent
  labels:
    app: urban-planning-agent
spec:
  replicas: 2
  selector:
    matchLabels:
      app: urban-planning-agent
  template:
    metadata:
      labels:
        app: urban-planning-agent
    spec:
      containers:
      - name: urban-planning-agent
        image: gcr.io/YOUR_PROJECT/urban-planning-agent:latest
        ports:
        - containerPort: 8000
        env:
        - name: SERVICE_ACCOUNT_KEY
          valueFrom:
            secretKeyRef:
              name: urban-planning-secrets
              key: service-account-key
        - name: PROJECT_ID
          value: "YOUR_PROJECT_ID"
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: urban-planning-service
spec:
  selector:
    app: urban-planning-agent
  ports:
  - port: 80
    targetPort: 8000
  type: LoadBalancer
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: urban-planning-agent-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: urban-planning-agent
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
---
apiVersion: v1
kind: Secret
metadata:
  name: urban-planning-secrets
type: Opaque
data:
  service-account-key: "BASE64_ENCODED_SERVICE_ACCOUNT_JSON"
